version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: studyspace-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: collaborative-study-room
    volumes:
      - mongo_data:/data/db
    networks:
      - studyspace-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: studyspace-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/collaborative-study-room
      - JWT_SECRET=supersecret_study_room_jwt_key_2026_prod
      - CLIENT_URL=http://localhost:5173,http://localhost,http://127.0.0.1
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      - mongo
    networks:
      - studyspace-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: studyspace-client
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - server
    networks:
      - studyspace-network

volumes:
  mongo_data:
    driver: local

networks:
  studyspace-network:
    driver: bridge
